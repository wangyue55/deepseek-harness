# Keyless replay counterpart to intranet-wiki.cordis.yml: the wiki tools and
# loopback fixture server stay real (the tool calls re-execute the actual HTTP
# reads and the create-child write against the fixture); only the model
# adapter is replaced by replay.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: intranet-wiki-fixture
            name: './intranet-wiki-fixture-server.mjs'
          - id: intranet-tool-wiki
            name: '@deepseek-ai/dsh-intranet-tool-wiki'
            config:
              baseUrlEnv: INTRANET_WIKI_SNAPSHOT_BASE_URL
              tokenEnv: INTRANET_WIKI_SNAPSHOT_TOKEN
              applyWriteApproval: ask
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
